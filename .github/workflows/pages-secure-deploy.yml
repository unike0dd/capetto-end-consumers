name: Secure GitHub Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate security and governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate JSON contracts
        run: find agent contracts -type f -name '*.json' -print0 | xargs -0 -r -n1 jq empty

      - name: Validate GitHub governance and security
        run: node scripts/verify-security.mjs index.html login.html

      - name: Validate storefront build
        run: node scripts/build-cloudflare.mjs consumer

      - name: Validate edge deployment
        run: npx --yes wrangler@4.135.0 deploy --dry-run --env non_specific

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd

  build:
    name: Build Pages artifact
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build allowlisted storefront
        run: node scripts/build-cloudflare.mjs consumer

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload built storefront
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
